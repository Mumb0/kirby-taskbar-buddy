  <script src="https://pixijs.download/v8.8.0/pixi.min.js"></script>

<body>

        { x: 66, y: 126, w: 29, h: 35 },

    },
    fighter: {

    },

      ]
    },
    mirror: {

        { x: 35, y: 117, w: 27, h: 37 },

    },
    ninja: {

        { x: 235, y: 45, w: 27, h: 32 },

      ]
    },
    paint: {

      coords: [
        { x: 5, y: 113, w: 26, h: 28 },
        { x: 34, y: 113, w: 26, h: 28 },

    },
    parasol: {

      coords: [
        { x: 269, y: 92, w: 42, h: 49 },
        { x: 314, y: 92, w: 42, h: 49 },
        { x: 359, y: 92, w: 42, h: 49 },
        { x: 404, y: 92, w: 42, h: 49 }
      ]
    },
    plasma: {
      key: 'a',
      file: './kirby-plasma.png',
      coords: [
        { x: 6, y: 357, w: 24, h: 34 },
        { x: 35, y: 357, w: 24, h: 34 },
        { x: 63, y: 357, w: 24, h: 34 },
        { x: 92, y: 357, w: 24, h: 34 }
      ]
    },
    stone: {
      key: 's',
      file: './kirby-stone.png',
      coords: [
        { x: 5, y: 123, w: 27, h: 32 },
        { x: 33, y: 123, w: 27, h: 32 },
        { x: 62, y: 123, w: 27, h: 32 },
        { x: 94, y: 123, w: 27, h: 32 }
      ]
    },
    suplex: {
      key: 'u',
      file: './kirby-suplex.png',
      coords: [
        { x: 6, y: 95, w: 26, h: 24 },
        { x: 36, y: 95, w: 26, h: 24 },
        { x: 66, y: 95, w: 26, h: 24 },
        { x: 96, y: 95, w: 26, h: 24 }
      ]
    },
    sword: {
      key: 'w',
      file: './kirby-sword.png',
      coords: [
        { x: 3, y: 101, w: 32, h: 30 },
        { x: 34, y: 101, w: 32, h: 30 },
        { x: 67, y: 101, w: 32, h: 30 },
        { x: 101, y: 101, w: 32, h: 30 }
      ]
    },
    wheel: {
      key: 'v',
      file: './kirby-wheel.png',
      coords: [
        { x: 5, y: 121, w: 26, h: 28 },
        { x: 34, y: 121, w: 26, h: 28 },
        { x: 62, y: 121, w: 26, h: 28 },
        { x: 92, y: 121, w: 26, h: 28 }
      ]
    },
    wing: {
      key: 'g',
      file: './kirby-wing.png',
      coords: [
        { x: 4, y: 127, w: 31, h: 32 },
        { x: 35, y: 127, w: 31, h: 32 },
        { x: 66, y: 127, w: 31, h: 32 },
        { x: 100, y: 127, w: 31, h: 32 }
      ]
    },
    yoyo: {
      key: 'y',
      file: './kirby-yoyo.png',
      coords: [
        { x: 5, y: 121, w: 26, h: 28 },
        { x: 34, y: 121, w: 26, h: 28 },
        { x: 62, y: 121, w: 26, h: 28 },
        { x: 92, y: 121, w: 26, h: 28 }
      ]
    }
  };

  // ==========================================================================
  // 2. PIXI SETUP, COLOR-KEYING & AUTOMATIC PIXEL-PERFECT BODY ALIGNMENT
  // ==========================================================================
  const app = new PIXI.Application();
  await app.init({
    resizeTo: window,
    backgroundColor: 0x000000,
    antialias: false
  });
  document.body.appendChild(app.canvas);

  const TILE_SIZE = 64;
  const PIVOT_X = 32;
  const PIVOT_Y = TILE_SIZE - 1; // Row 63 (bottom floor pixel)

  // Loads a spritesheet, removes background colors, and auto-aligns each frame by Kirby's lower body/feet
  async function loadAlignedFrames(url, coords) {
    const img = new Image();
    img.src = url;
    await img.decode();

    const rawCanvas = document.createElement('canvas');
    rawCanvas.width = img.width;
    rawCanvas.height = img.height;
    const rawCtx = rawCanvas.getContext('2d');
    rawCtx.drawImage(img, 0, 0);

    const imgData = rawCtx.getImageData(0, 0, rawCanvas.width, rawCanvas.height);
    const data = imgData.data;

    // Strip outer sheet background (0,0) and inner sprite-box backgrounds (#709AD1, #9696FF, plus frame top-left corner)
    const bgColors = [
      [data[0], data[1], data[2]],
      [112, 154, 209],
      [150, 150, 255]
    ];
    if (coords && coords.length > 0) {
      const tlIdx = (coords[0].y * rawCanvas.width + coords[0].x) * 4;
      bgColors.push([data[tlIdx], data[tlIdx + 1], data[tlIdx + 2]]);
    }

    for (let i = 0; i < data.length; i += 4) {
      const r = data[i], g = data[i + 1], b = data[i + 2];
      for (let c = 0; c < bgColors.length; c++) {
        if (r === bgColors[c][0] && g === bgColors[c][1] && b === bgColors[c][2]) {
          data[i + 3] = 0;
          break;
        }
      }
    }
    rawCtx.putImageData(imgData, 0, 0);

    // Build a normalized strip of 64x64 tiles where Kirby's feet & lower body are locked to (PIVOT_X, PIVOT_Y)
    const stripCanvas = document.createElement('canvas');
    stripCanvas.width = TILE_SIZE * coords.length;
    stripCanvas.height = TILE_SIZE;
    const stripCtx = stripCanvas.getContext('2d');

    coords.forEach((f, idx) => {
      // 1. Find lowest non-transparent pixel (maxY) so Kirby's feet never float
      let maxY = f.h - 1;
      for (let dy = 0; dy < f.h; dy++) {
        for (let dx = 0; dx < f.w; dx++) {
          const alpha = data[((f.y + dy) * rawCanvas.width + (f.x + dx)) * 4 + 3];
          if (alpha > 0) maxY = dy;
        }
      }

      // 2. Measure Kirby's shoes (bottom 4px: maxY-3 .. maxY) which are identical across every ability
      let feetMinX = f.w, feetMaxX = 0;
      const startY = Math.max(0, maxY - 3);
      for (let dy = startY; dy <= maxY; dy++) {
        for (let dx = 0; dx < f.w; dx++) {
          const alpha = data[((f.y + dy) * rawCanvas.width + (f.x + dx)) * 4 + 3];
          if (alpha > 0) {
            if (dx < feetMinX) feetMinX = dx;
            if (dx > feetMaxX) feetMaxX = dx;
          }
        }
      }

      const bodyPivotX = Math.floor((feetMinX + feetMaxX) / 2);
      const destX = idx * TILE_SIZE + (PIVOT_X - bodyPivotX);
      const destY = PIVOT_Y - maxY;

      stripCtx.drawImage(rawCanvas, f.x, f.y, f.w, f.h, destX, destY, f.w, f.h);
    });

    const baseTex = PIXI.Texture.from(stripCanvas);
    baseTex.source.scaleMode = 'nearest';

    const t = coords.map((_, idx) => new PIXI.Texture({
      source: baseTex.source,
      frame: new PIXI.Rectangle(idx * TILE_SIZE, 0, TILE_SIZE, TILE_SIZE)
    }));

    // In Kirby Super Star, the 4 sprites (0, 1, 2, 3) are:
    // 0: Left stride (head down) -> 1, 2: Passing (head up) -> 3: Right stride (head down).
    // Ping-ponging [0, 1, 2, 3, 2, 1] completes the return step so his feet don't teleport from 3 -> 0!
    return t.length === 4 ? [t[0], t[1], t[2], t[3], t[2], t[1]] : t;
  }

  // Load all forms defined in KIRBY_FORMS automatically
  const formFrames = {};
  const keyToForm = {};

  await Promise.all(
    Object.entries(KIRBY_FORMS).map(async ([formName, config]) => {
      formFrames[formName] = await loadAlignedFrames(config.file, config.coords);
      if (config.key) {
        keyToForm[config.key.toLowerCase()] = formName;
      }
    })
  );

  // ==========================================================================
  // 3. CONFIGURE ANIMATED SPRITE
  // ==========================================================================
  let currentForm = 'normal';
  const kirby = new PIXI.AnimatedSprite(formFrames[currentForm]);
  const SCALE = 2;
  kirby.scale.set(SCALE);

  // Anchor at bottom-center of the normalized 64x64 tile (PIVOT_X = 32, PIVOT_Y = 63)
  kirby.anchor.set(0.5, 1.0);
  kirby.x = -32;
  kirby.y = app.screen.height - 48;

  kirby.animationSpeed = 0.1; // ~12 FPS animation speed
  kirby.play();
  app.stage.addChild(kirby);

  // ==========================================================================
  // 4. KEYBOARD & GLOBAL KEY-BRIDGE HANDLER
  // ==========================================================================
  const lastKeyTriggerTime = {};

  function switchForm(targetForm) {
    // If pressing the key of the form we're already in, toggle back to 'normal'
    const nextForm = (currentForm === targetForm && targetForm !== 'normal') ? 'normal' : targetForm;
    if (nextForm === currentForm || !formFrames[nextForm]) return;

    currentForm = nextForm;

    // Preserve exact fractional animation time so rapid switching never stutters
    const savedTime = kirby._currentTime;
    const nextFrames = formFrames[currentForm];

    kirby.textures = nextFrames;
    kirby.gotoAndPlay(Math.floor(savedTime) % nextFrames.length);
    kirby._currentTime = savedTime;
  }

  function handleKeyPress(key) {
    const k = key.toLowerCase();

    // Ignore duplicate triggers within 50ms (e.g. if both native keydown and key-bridge fire)
    const now = performance.now();
    if (lastKeyTriggerTime[k] && (now - lastKeyTriggerTime[k] < 50)) return;
    lastKeyTriggerTime[k] = now;

    if (keyToForm[k]) {
      switchForm(keyToForm[k]);
    }
  }

  // Listen to direct key presses (when desktop is focused)
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    handleKeyPress(e.key);
  });

  // Listen to global key presses from KirbyKeyBridge.exe (when Notepad / other apps are focused)
  function connectKeyBridge() {
    const es = new EventSource('http://127.0.0.1:19855/events');
    es.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.key) handleKeyPress(data.key);
      } catch (err) {}
    };
    es.onerror = () => {
      es.close();
      setTimeout(connectKeyBridge, 2000);
    };
  }
  connectKeyBridge();

  // ==========================================================================
  // 5. WALK ACROSS SCREEN
  // ==========================================================================
  const walkSpeed = 1.5;

  app.ticker.add((ticker) => {
    kirby.x += walkSpeed * ticker.deltaTime;

    const halfWidth = 32 * SCALE;
    if (kirby.x > app.screen.width + halfWidth) {
      kirby.x = -halfWidth;
    }
  });

  window.addEventListener('resize', () => {
    kirby.y = app.screen.height - 64;
  });
})();
</script>
</body>
</html>
